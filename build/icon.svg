<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Purple Gradient for Moon -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3b4f" />
      <stop offset="100%" stop-color="#1f1f2e" />
    </linearGradient>

    <!-- Purple Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background: Rounded Square with very rounded corners -->
  <rect width="512" height="512" rx="115" ry="115" fill="#0d0d12" />
  <rect x="3" y="3" width="506" height="506" rx="112" ry="112" fill="none" stroke="url(#borderGradient)" stroke-width="4" opacity="0.6" />

  <!-- Center Crescent and Checkmark Group -->
  <g transform="translate(10, 0)">
    <!-- Glow behind crescent -->
    <path d="M 245 130 
             C 170 130 110 190 110 265 
             C 110 340 170 400 245 400 
             C 295 400 338 372 360 335 
             C 285 348 215 315 195 255 
             C 180 205 210 155 245 130 Z" 
          fill="#8b5cf6" opacity="0.35" filter="url(#softGlow)" />

    <!-- Crescent Moon with Purple Gradient -->
    <path d="M 245 130 
             C 170 130 110 190 110 265 
             C 110 340 170 400 245 400 
             C 295 400 338 372 360 335 
             C 285 348 215 315 195 255 
             C 180 205 210 155 245 130 Z" 
          fill="url(#purpleGradient)" />

    <!-- Clean crisp checkmark beside/nestled in crescent -->
    <path d="M 242 270 L 292 320 L 392 195" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
